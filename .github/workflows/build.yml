name: Build ESP32-S3 (3 Files)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка PlatformIO
        run: pip install -U platformio

      - name: Компиляция прошивки
        run: pio run

      - name: Сохранение 3 файлов прошивки
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-3files
          path: |
            .pio/build/esp32-s3-devkitc-1/bootloader.bin
            .pio/build/esp32-s3-devkitc-1/partitions.bin
            .pio/build/esp32-s3-devkitc-1/firmware.bin
            
